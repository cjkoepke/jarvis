[package]
name = "jarvis"
version = "0.0.1"
edition = "2021"
description = "Proof of concept: puts my working standards into every AI agent session and reviews changes before push."
publish = false

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "8.0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
