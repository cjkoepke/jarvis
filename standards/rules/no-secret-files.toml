# @TODO: sample rule that exercises the review. Replace or remove it once real rules are written.
id = "no-secret-files"
description = "Secrets and .env files are never committed."
level = "block"
kind = "forbidden-path"
pattern = '(^|/)\.env(\.[^/]+)?$|(^|/)id_rsa$|\.pem$'
message = "Remove this file from the commits being pushed and add it to .gitignore."
